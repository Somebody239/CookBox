name: Build unsigned iOS IPA

on:
  release:
    types: [published]
  workflow_dispatch:

# Required only when a published GitHub Release needs the IPA attached to it.
permissions:
  contents: write

jobs:
  build:
    name: Build CookBox
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # GitHub's current macOS runner uses Xcode 26.5. Convert this temporary
      # checkout from the newer local Xcode project format before building.
      # This does not modify the project stored in the repository.
      - name: Prepare project for hosted Xcode
        run: |
          sed -i '' \
            -e 's/objectVersion = 110;/objectVersion = 77;/' \
            -e 's/IPHONEOS_DEPLOYMENT_TARGET = 27.0;/IPHONEOS_DEPLOYMENT_TARGET = 26.0;/' \
            CookBox.xcodeproj/project.pbxproj

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project CookBox.xcodeproj \
            -scheme CookBox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/CookBox.app ipa/Payload/
          cd ipa
          zip -qry ../CookBox-unsigned.ipa Payload

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CookBox-unsigned-ipa
          path: CookBox-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: CookBox-unsigned.ipa
          fail_on_unmatched_files: true
